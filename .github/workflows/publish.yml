name: Publish

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type publish to confirm uploading to pub.dev
        required: true
        type: string

jobs:
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.inputs.confirm == 'publish'

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Publish dry-run
        run: dart pub publish --dry-run

      - name: Publish
        run: dart pub publish --force

